# Tiny Tapeout project information
project:
  title:        "Pong with a trail"
  author:       "PvpGrief"
  discord:      ""
  description:  "Two-player VGA Pong; the ball leaves a trail and speeds up every return"
  language:     "Verilog"
  clock_hz:     25175000

  # ~4.2k generic gates after Yosys synthesis; estimate, not yet hardened
  tiles: "3x2"

  top_module:  "tt_um_pvpgrief_pong"

  source_files:
    - "tt_um_pvpgrief_pong.v"

# TinyVGA Pmod on the outputs, Gamepad Pmod (or plain buttons) on the inputs
pinout:
  ui[0]: "left paddle up"
  ui[1]: "left paddle down"
  ui[2]: "right paddle up"
  ui[3]: "right paddle down"
  ui[4]: "gamepad pmod latch"
  ui[5]: "gamepad pmod clock"
  ui[6]: "gamepad pmod data"
  ui[7]: "new game"

  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
